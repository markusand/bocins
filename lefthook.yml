colors: false

pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "src/**/*.{ts,vue}"
      env:
        NO_COLOR: "1"
      run: npx eslint {staged_files}

    - name: stylelint
      glob: "src/**/*.{vue,css}"
      env:
        NO_COLOR: "1"
      run: npx stylelint {staged_files}

    - name: test
      glob: "src/**/*.{ts,vue}"
      env:
        NO_COLOR: "1"
        DEBUG_PRINT_LIMIT: "0"
      run: |
        TESTS=""
        for file in {staged_files}; do
          test_file="${file%.vue}.test.ts"
          [ -f "$test_file" ] && TESTS="$TESTS $test_file"
          echo "$file" | grep -q '\.test\.ts$' && TESTS="$TESTS $file"
          test_file="${file%.ts}.test.ts"
          [ -f "$test_file" ] && TESTS="$TESTS $test_file"
        done
        TESTS=$(echo "$TESTS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
        [ -z "$TESTS" ] && exit 0
        npx vitest run $TESTS
